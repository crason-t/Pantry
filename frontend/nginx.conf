server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app is a client-routed SPA, so any path that isn't a real file has
    # to fall through to index.html -- otherwise a refresh on /cookbook 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache indefinitely; index.html must not
    # be, or clients keep booting the previous deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
