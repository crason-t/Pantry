services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "5433:5432"
    volumes:
      - ticket_tracker_db_data:/var/lib/postgresql/data

volumes:
  ticket_tracker_db_data:
