# Explicit project name: this directory's basename ("ticket-tracker") isn't
# unique across worktrees, and Compose defaults the project name (and thus
# container/network names) to the directory basename -- without this, two
# worktrees both named "ticket-tracker" collide on the same container name.
name: pantry-standalone-ticket-tracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "5434:5432"
    volumes:
      - ticket_tracker_db_data:/var/lib/postgresql/data

volumes:
  ticket_tracker_db_data:
