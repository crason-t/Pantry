name: CI

# The other two workflows in this repo automate ticket/milestone bookkeeping;
# this one is the correctness gate. It has to pass before a PR can merge, so
# it deliberately needs no secrets: the backend tests stub the Claude call and
# never touch Postgres, and the frontend only builds and lints.

on:
  pull_request:
  push:
    branches: [master]

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version, unlike the other actions here:
      # setup-uv stopped publishing moving major tags after v7.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs `tsc -b` first, so this also type-checks the app.
      - name: Build
        run: npm run build
